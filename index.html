<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termux & Cyber Security Sinhala Hub</title>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --text-color: #1a1d20;
      --nav-bg: #12181b;
      --accent-color: #ff3e00;
      --terminal-bg: #0d1117;
      --border-color: #e1e4e8;
    }

    [data-theme="dark"] {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #f0f6fc;
      --nav-bg: #010409;
      --border-color: #30363d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
      padding-bottom: 60px;
    }

    .navbar {
      background-color: var(--nav-bg);
      padding: 12px 15px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-color);
    }

    .nav-title {
      color: #00ff66;
      font-weight: bold;
      font-size: 15px;
    }

    .admin-link {
      color: #fff;
      background: var(--accent-color);
      padding: 5px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .terminal-box {
      background-color: var(--terminal-bg);
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .card-desc {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
    }

    .tag {
      background-color: var(--accent-color);
      color: #ffffff;
      padding: 4px 8px;
      border-radius: 3px;
      font-weight: bold;
    }

    .date {
      color: #888;
    }

    .theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: none;
      background-color: var(--nav-bg);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-title">● TERMUX & HACKING SINHALA</div>
    <a href="admin.html" class="admin-link">🔑 Admin Login</a>
  </nav>

  <div class="container" id="postsContainer">
    <p style="text-align: center; color: #888;">ලිපි ලබාගනිමින් පවතී...</p>
  </div>

  <button class="theme-toggle" id="themeToggle">☀️</button>

  <script>
    async function loadPosts() {
      try {
        const res = await fetch('posts.json?v=' + Date.now());
        const posts = await res.json();
        renderPosts(posts);
      } catch (err) {
        document.getElementById('postsContainer').innerHTML = '<p style="text-align: center;">තවම ලිපි ඇතුළත් කර නොමැත.</p>';
      }
    }

    function renderPosts(posts) {
      const container = document.getElementById('postsContainer');
      container.innerHTML = '';

      posts.forEach(post => {
        const card = document.createElement('article');
        card.className = 'card';
        
        let codeBlock = post.code ? `<div class="terminal-box">${escapeHtml(post.code)}</div>` : '';

        card.innerHTML = `
          <h2>${escapeHtml(post.title)}</h2>
          ${codeBlock}
          <p class="card-desc">${escapeHtml(post.desc)}</p>
          <div class="card-footer">
            <span class="tag">${escapeHtml(post.tag)}</span>
            <span class="date">/ ${post.date}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      if (document.body.getAttribute('data-theme') === 'dark') {
        document.body.removeAttribute('data-theme');
        themeToggle.textContent = '☀️';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeToggle.textContent = '🌙';
      }
    });

    loadPosts();
  </script>
</body>
</html>
